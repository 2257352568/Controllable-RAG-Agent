services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-max}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      QWEN_EMBEDDING_DIMENSIONS: ${QWEN_EMBEDDING_DIMENSIONS:-1536}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-5}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-60}
      RAG_CHUNKS_TOP_K: ${RAG_CHUNKS_TOP_K:-1}
      RAG_SUMMARIES_TOP_K: ${RAG_SUMMARIES_TOP_K:-1}
      RAG_QUOTES_TOP_K: ${RAG_QUOTES_TOP_K:-10}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_MODEL_REQUESTS: ${AGENT_MAX_MODEL_REQUESTS:-40}
      AGENT_MAX_TOTAL_TOKENS: ${AGENT_MAX_TOTAL_TOKENS:-20000}
      GROUNDING_MAX_ATTEMPTS: ${GROUNDING_MAX_ATTEMPTS:-2}
      RAG_API_MAX_CONCURRENT_REQUESTS: ${RAG_API_MAX_CONCURRENT_REQUESTS:-8}
    restart: unless-stopped
